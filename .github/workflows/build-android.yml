name: Build EcomVideoStudio Android (APK)
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
    inputs:
      ffmpeg_dep:
        description: "Bibliothèque FFmpeg Android (laisser vide = valeur par défaut)"
        required: false
        default: ""
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      FFMPEG_KIT_DEP: ${{ github.event.inputs.ffmpeg_dep }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - name: Install dependencies (with retries)
        run: |
          for i in 1 2 3 4 5; do
            echo "npm install - tentative $i/5"
            npm install --no-audit --no-fund && break
            if [ "$i" = "5" ]; then echo "npm install a échoué"; exit 1; fi
            sleep $((i * 15))
          done
      - name: Add Groq API keys from the repository secret (not stored in the code)
        env:
          GROQ_API_KEYS: ${{ secrets.GROQ_API_KEYS }}
        run: node scripts/inject-keys.js
      - name: Prepare web app (www)
        run: node scripts/build-www.js
      - name: Test FFmpeg graph builder
        run: node scripts/test-graph.js
      - name: Create Android project
        run: |
          rm -rf android
          npx cap add android
      - name: Add native code (FFmpeg, import, gallery)
        run: |
          if [ -z "$FFMPEG_KIT_DEP" ]; then unset FFMPEG_KIT_DEP; fi
          node scripts/patch-android.js
          npx cap sync android
      - name: Use the fixed signing key (same signature on every build)
        run: |
          mkdir -p ~/.android
          cp signing/debug.keystore ~/.android/debug.keystore
      - name: Build APK (with retries)
        working-directory: android
        run: |
          chmod +x gradlew
          for i in 1 2 3; do
            echo "gradle - tentative $i/3"
            ./gradlew assembleDebug --no-daemon --stacktrace && break
            if [ "$i" = "3" ]; then echo "La compilation a échoué"; exit 1; fi
            sleep $((i * 20))
          done
      - name: Rename APK
        run: |
          mkdir -p release
          cp android/app/build/outputs/apk/debug/app-debug.apk release/EcomVideoStudio-Android-1.1.0.apk
      # Version commerciale : l'APK n'est PAS publié en Release publique. Téléchargez-le dans « Artifacts » (dépôt privé).
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: EcomVideoStudio-Android-APK
          path: release/*.apk
